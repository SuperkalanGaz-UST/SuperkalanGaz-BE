name: superkalan-traccar

services:
  database:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in the VM-local .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in the VM-local .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the VM-local .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the VM-local .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
    mem_limit: 512m
    cpus: 0.75
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, --silent]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  traccar:
    image: ${TRACCAR_IMAGE:-traccar/traccar:6.16.0}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: com.mysql.cj.jdbc.Driver
      DATABASE_URL: "jdbc:mysql://database:3306/traccar?zeroDateTimeBehavior=round&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true&autoReconnect=true&useUnicode=yes&characterEncoding=UTF-8&sessionVariables=sql_mode=''"
      DATABASE_USER: ${MYSQL_USER:?Set MYSQL_USER in the VM-local .env}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the VM-local .env}
    mem_limit: 768m
    cpus: 1.0
    ports:
      - "${TRACCAR_DEVICE_PORT:?Set the verified ST-901 protocol port}:${TRACCAR_DEVICE_PORT:?Set the verified ST-901 protocol port}/tcp"
    volumes:
      - traccar_logs:/opt/traccar/logs
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8082/api/health]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5m

  private-api-proxy:
    image: ${TRACCAR_PROXY_IMAGE:-nginx:1.30.5-alpine3.24}
    profiles: [private-api]
    restart: unless-stopped
    depends_on:
      traccar:
        condition: service_healthy
    ports:
      - "${TRACCAR_VM_PRIVATE_IP:?Set the VM private IP before enabling private-api}:443:443/tcp"
    volumes:
      - ./nginx/traccar-api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/traccar-api.crt:/etc/nginx/certs/tls.crt:ro
      - ./certs/traccar-api.key:/etc/nginx/certs/tls.key:ro

volumes:
  mysql_data:
  traccar_logs:
