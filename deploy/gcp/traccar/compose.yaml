name: superkalan-traccar

services:
  database:
    image: ${MYSQL_IMAGE:-mysql:8.4@sha256:80f4933e3835f9dc4d35a28ec500d7986cb4414e6c6821c5461239cb7beb8995}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in the VM-local .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in the VM-local .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the VM-local .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the VM-local .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=30
      - --performance-schema=OFF
    mem_limit: 640m
    cpus: 0.75
    volumes:
      - mysql_data:/var/lib/mysql
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -N -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  traccar:
    image: ${TRACCAR_IMAGE:-traccar/traccar:6.16.0@sha256:a32a4e0a0656a3fc9ba0b23e9e741be2fab76d85c5208b6adfeef7ab473979e8}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:MaxDirectMemorySize=128m -XX:ActiveProcessorCount=2"
      DATABASE_DRIVER: com.mysql.cj.jdbc.Driver
      DATABASE_URL: "jdbc:mysql://database:3306/${MYSQL_DATABASE:?Set MYSQL_DATABASE}?zeroDateTimeBehavior=round&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true&autoReconnect=true&useUnicode=yes&characterEncoding=UTF-8&sessionVariables=sql_mode=''"
      DATABASE_USER: ${MYSQL_USER:?Set MYSQL_USER in the VM-local .env}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the VM-local .env}
      DATABASE_MAXPOOLSIZE: "5"
      PROTOCOLS_ENABLE: h02
      H02_PORT: ${TRACCAR_DEVICE_PORT:?Set the verified ST-901 protocol port}
      SERVER_NETTYBOSSTHREADS: "1"
      SERVER_NETTYTHREADS: "2"
    mem_limit: 768m
    cpus: 1.0
    ports:
      - "${TRACCAR_DEVICE_BIND_IP:-0.0.0.0}:${TRACCAR_DEVICE_PORT:?Set the verified ST-901 protocol port}:${TRACCAR_DEVICE_PORT:?Set the verified ST-901 protocol port}/tcp"
    volumes:
      - traccar_logs:/opt/traccar/logs
    logging: *bounded-logging
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8082/api/health]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5m

  private-api-proxy:
    image: ${TRACCAR_PROXY_IMAGE:-nginx:1.30.5-alpine3.24@sha256:8f84ed99befc3891b8f329c5c202785278a2cfb7c25107d57fb2a134a3117433}
    platform: linux/amd64
    profiles: [private-api]
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    logging: *bounded-logging
    depends_on:
      traccar:
        condition: service_healthy
    ports:
      - "${TRACCAR_VM_PRIVATE_IP:?Set the VM private IP before enabling private-api}:443:443/tcp"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/traccar-api.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TRACCAR_TLS_CERT_FILE:-./certs/traccar-api.crt}:/etc/nginx/certs/tls.crt:ro
      - ${TRACCAR_TLS_KEY_FILE:-./certs/traccar-api.key}:/etc/nginx/certs/tls.key:ro
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  traccar_logs:
